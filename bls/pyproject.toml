[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blsutils"
version = "0.5.1"
description = "Utilities for working with BLS data or its api"
authors = [
  { name = "Daniel J. Kim", email = "pybokeh@protonmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib",
    "polars",
    "numpy",
    "requests",
    "python-dotenv"
]
